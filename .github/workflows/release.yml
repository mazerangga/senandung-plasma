name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata.json
        run: python3 -c "import json; d=json.load(open('metadata.json')); print(d['KPlugin']['Id'], d['KPlugin']['Version'])"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="$(python3 -c "import json;print(json.load(open('metadata.json'))['KPlugin']['Version'])")"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME tidak sama dengan versi di metadata.json (v$ver)"
            exit 1
          fi

      - name: Build .plasmoid
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: senandung-plasma
          path: dist/*.plasmoid

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.plasmoid
          generate_release_notes: true
